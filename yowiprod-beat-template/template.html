<!doctype html>
<!-- ============================================================================
yowiprod · PLANTILLA de reel de beatmaking (sin voz) — HyperFrames

Reels de sesión de FL Studio (beat + cámara en PiP), SIN narración. El título
entra cuando ROMPE el beat (el drop), queda la línea "DÍA X DE 30" sola unos
segundos, y después se suma el nombre del beat + key + BPM un 20% más abajo.

Reemplazar SOLO los {{PLACEHOLDERS}}:
  {{DURATION}}   duración del master en segundos (usar la del STREAM DE VIDEO:
                 ffprobe -select_streams v:0 -show_entries stream=duration)
  {{MASTER_SRC}} ruta al master.mp4 (video recortado + loudnorm, 1080x1920 @60fps)
  {{DIA}}        "DÍA 1 DE 30" (ChromeBlack, blanco)
  {{NOMBRE}}     nombre del beat (Chrome fina, amarillo)
  {{KEY_BPM}}    "D#MIN · 143 BPM" (Chrome fina, blanco)
  {{DROP}}       segundo en que rompe el beat (detectar con lowpass 150Hz RMS)
  {{HOLD_SOLO}}  segundos que "DÍA X DE 30" queda sola antes de sumar el resto (10)
  {{HOLD_FULL}}  segundos extra que quedan ambos antes de salir (5)

Marca: fuentes Chrome (Black = títulos, Normal = datos) + amarillo #FFD700 /
blanco #FFFFFF. Ver brand.json. El título va SIN fondo, mayúsculas, centrado,
con borde negro para leer sobre el video.
============================================================================ -->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "ChromeBlack"; src: url("fonts/ChromeBlack-Normal.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "ChromeNormal"; src: url("fonts/Chrome-Normal.ttf") format("truetype"); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #main-v { width: 1080px; height: 1920px; object-fit: cover; }

      .line {
        text-align: center; text-transform: uppercase; line-height: 0.98;
        -webkit-text-stroke: 5px #000; paint-order: stroke fill;
        text-shadow: 0 6px 22px rgba(0,0,0,0.65), 0 2px 6px rgba(0,0,0,0.9);
      }
      /* DÍA X DE 30 — centrado en el medio (50%). El -50% lo pone GSAP (yPercent). */
      #dia {
        position: absolute; left: 0; right: 0; top: 50%;
        z-index: 40; padding: 0 60px;
        font-family: "ChromeBlack"; font-size: 130px; color: #FFFFFF;
        will-change: transform, opacity;
      }
      /* Nombre + key/bpm — 20% del alto más abajo (centro en 70%). */
      #meta {
        position: absolute; left: 0; right: 0; top: 70%;
        z-index: 40; padding: 0 60px;
        will-change: transform, opacity;
      }
      #meta .name { font-family: "ChromeNormal"; font-size: 104px; color: #FFD700; -webkit-text-stroke: 4px #000; }
      #meta .kb   { font-family: "ChromeNormal"; font-size: 54px;  color: #FFFFFF; -webkit-text-stroke: 3px #000; letter-spacing: 1px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1080"
      data-height="1920"
    >
      <video id="main-v" class="clip" data-start="0" data-duration="{{DURATION}}"
             data-track-index="0" data-media-start="0" src="{{MASTER_SRC}}" muted playsinline></video>
      <audio id="main-a" data-start="0" data-duration="{{DURATION}}"
             data-track-index="3" data-media-start="0" src="{{MASTER_SRC}}" data-volume="1"></audio>

      <div id="dia" class="line">{{DIA}}</div>
      <div id="meta">
        <div class="line name">{{NOMBRE}}</div>
        <div class="line kb">{{KEY_BPM}}</div>
      </div>
    </div>

    <script>
      const DROP = {{DROP}};          // el beat rompe
      const HOLD_SOLO = {{HOLD_SOLO}}; // DÍA sola (default 10s)
      const META_IN = DROP + HOLD_SOLO;
      const OUT = META_IN + {{HOLD_FULL}}; // ambos quedan y salen (default +5s)

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // estado inicial oculto (yPercent -50 = centrado vertical, lo mantiene GSAP)
      tl.set("#dia",  { yPercent: -50, opacity: 0, scale: 0.9 }, 0);
      tl.set("#meta", { yPercent: -50, opacity: 0, y: 40 }, 0);

      tl.to("#dia",  { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, DROP);
      tl.to("#meta", { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.5)" }, META_IN);
      tl.to(["#dia", "#meta"], { opacity: 0, duration: 0.35, ease: "power2.in" }, OUT);
      tl.set(["#dia", "#meta"], { visibility: "hidden" }, OUT + 0.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
