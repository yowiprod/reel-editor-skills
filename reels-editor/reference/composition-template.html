<!doctype html>
<!-- ============================================================================
reels-editor · TEMPLATE DE COMPOSICIÓN (HyperFrames)

Todo lo que es MARCA (tipografía, colores, tamaños base) sale de `brand.css`,
que genera `scripts/setup-brand.mjs` a partir de `brand.json`. Este archivo NO
lleva ningún color ni fuente hardcodeada: cambiá la marca en brand.json, no acá.

Reemplazar SOLO los {{PLACEHOLDERS}}:
  {{DURATION}}     duración del master en segundos — usar la del STREAM DE VIDEO
                   (ffprobe -select_streams v:0), no la del container: el audio AAC
                   puede ser ~40ms más largo y deja frames finales en negro
  {{MASTER_SRC}}   ruta relativa al master, ej: reel-slug/master.mp4
  {{CAPTIONS_SRC}} ruta relativa al captions.js, ej: reel-slug/captions.js
  {{HOOK_LINE1}}   línea 1 del hook, MAYÚSCULAS, ≤ 4-5 palabras (chip oscuro)
  {{HOOK_LINE2}}   línea 2 del hook, MAYÚSCULAS, ≤ 3 palabras (chip de acento = el punch)

Lo que SÍ es criterio de edición (y no se toca sin pedido explícito): una palabra
por vez con corte seco, safe zones de Instagram, sombra con blur en los chips,
el hook saliendo a los 3.2s y el auto-fit de las palabras largas.

MODO LETTERBOX (fuente horizontal): además de los placeholders, BORRAR el
<div id="scrim"> — el master ya trae las franjas negras horneadas, los captions
van sobre negro puro y el gradiente solo ensuciaría el borde inferior del video.
============================================================================ -->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="{{CAPTIONS_SRC}}"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      #root { position: relative; width: 1080px; height: 1920px; }

      #main-v { width: 1080px; height: 1920px; object-fit: cover; }

      /* Scrim inferior: gradiente de contraste para que los captions lean
         sobre cualquier fondo (incluye b-rolls de pantallas blancas) */
      #scrim {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 880px;
        z-index: 10;
        background: linear-gradient(
          to top,
          rgba(0,0,0,0.78) 0%,
          rgba(0,0,0,0.46) 40%,
          rgba(0,0,0,0) 100%
        );
        pointer-events: none;
      }

      /* ===== HOOK (primeros ~3s) — chips de marca en zona segura superior =====
         Safe zones IG Reels (1080x1920): libre top 250 / bottom 420 / right 144 / left 60.
         --hook-top (300 por defecto) queda bajo la UI superior de IG y sobre la
         cabeza en un encuadre selfie típico de iPhone. Si el screenshot de
         verificación muestra que el chip corta la cabeza: achicar y subir
         (hasta top:255, que es el piso de la safe zone). */
      #hook {
        position: absolute;
        top: var(--hook-top);
        left: 0; right: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .hook-chip {
        display: inline-block;
        font-family: var(--brand-font);
        font-weight: var(--brand-font-weight);
        font-size: var(--hook-font-size);
        line-height: 1;
        letter-spacing: -0.01em;
        padding: 26px 38px 24px;
        border-radius: var(--hook-radius);
        white-space: nowrap;
        will-change: transform, opacity;
        /* La sombra de TODO elemento flotante sobre video va SIEMPRE con blur.
           Una sombra dura tipo "0 6px 0" se lee como un segundo recuadro gris. */
        box-shadow: 0 12px 32px rgba(0,0,0,0.40), 0 4px 12px rgba(0,0,0,0.25);
      }
      #hook-l1 { background: var(--brand-dark); color: var(--brand-light); }
      #hook-l2 { background: var(--brand-accent); color: var(--brand-accent-ink); }

      /* ===== CAPTIONS — una palabra por vez, corte seco =====
         Tamaño CHICO estilo caption nativo de IG (~30% del ancho): sin karaoke,
         sin pop, sin animación de entrada/salida, nunca dos palabras a la vez. */
      #caption-layer {
        position: absolute;
        left: 0; right: 0;
        bottom: var(--caption-bottom);
        z-index: 20;
        height: 200px;
        display: block;
      }
      .cw {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
      }
      .cw span {
        display: inline-block;
        font-family: var(--brand-font);
        font-weight: var(--brand-font-weight);
        line-height: 1.05;
        letter-spacing: -0.01em;
        color: var(--caption-color);
        -webkit-text-stroke: 3px #000;
        paint-order: stroke fill;
        text-shadow: 0 3px 10px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.9);
        white-space: nowrap;
      }
      /* Palabra de énfasis: color de acento ESTÁTICO + glow sutil (sin animación) */
      .cw.emph span {
        color: var(--caption-emph-color);
        text-shadow: 0 0 26px var(--caption-emph-glow), 0 4px 12px rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1080"
      data-height="1920"
    >
      <!-- Video principal muted + audio del MISMO master en track separado
           (convención HyperFrames: video usa muted, el audio va en <audio>) -->
      <video
        id="main-v"
        class="clip"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="0"
        data-media-start="0"
        src="{{MASTER_SRC}}"
        muted
        playsinline
      ></video>
      <audio
        id="main-a"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="3"
        data-media-start="0"
        src="{{MASTER_SRC}}"
        data-volume="1"
      ></audio>

      <!-- Capas: scrim (z10) < captions (z20) < hook (z40). Sin handle ni logo fijo:
           tapan contenido y no suman.
           MODO LETTERBOX (fuente horizontal): BORRAR el div#scrim de abajo. -->
      <div id="scrim"></div>
      <div id="caption-layer"></div>
      <div id="hook">
        <div class="hook-chip" id="hook-l1">{{HOOK_LINE1}}</div>
        <div class="hook-chip" id="hook-l2">{{HOOK_LINE2}}</div>
      </div>
    </div>

    <script>
      // ===== Datos generados por build-captions.mjs =====
      const CAPTIONS = window.__CAPTIONS.captions;
      const DUR = {{DURATION}};

      // ===== Timing one-word (criterio cerrado) =====
      // - la palabra aparece 30ms antes de decirse (percepción de sincro perfecta)
      // - si el gap con la siguiente es < 0.45s, sostiene hasta que entra la próxima
      // - en pausas largas sale sola a +0.25s y la pantalla queda limpia
      // - el hide NUNCA pisa el show de la siguiente: jamás dos palabras a la vez
      //   (no forzar duración mínima: rompe con palabras de 1 letra del splitTiming)
      const shows = CAPTIONS.map((w) => Math.max(0, w.s - 0.03));
      const WORDS = CAPTIONS.map((w, i) => {
        const next = CAPTIONS[i + 1];
        const show = shows[i];
        let hide;
        if (next) {
          const gap = next.s - w.e;
          hide = gap < 0.45 ? shows[i + 1] : Math.min(w.e + 0.25, shows[i + 1]);
        } else {
          hide = Math.min(w.e + 0.4, DUR);
        }
        return { ...w, show, hide: Math.max(hide, show) };
      });

      // ===== Tamaño por palabra =====
      // Los tres números salen de brand.css (brand.json): tamaño base, mínimo y
      // ancho máximo (mantiene la palabra dentro de la safe zone lateral de IG).
      // El ancho se estima con --brand-char-width (ancho medio de glifo de TU
      // tipografía) y después se REFINA midiendo en el navegador, así el pipeline
      // funciona igual con una condensada o con una ancha.
      const cssVar = (n, d) => {
        const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(n));
        return Number.isFinite(v) ? v : d;
      };
      const MAX_W = cssVar("--caption-max-width", 790);
      const BASE = cssVar("--caption-base-size", 54);
      const MIN = cssVar("--caption-min-size", 40);
      const AVG_CHAR = cssVar("--brand-char-width", 0.62);
      const fontSizeFor = (t) =>
        Math.max(MIN, Math.min(BASE, Math.floor(MAX_W / (Math.max(t.length, 1) * AVG_CHAR))));

      // ===== Render DOM =====
      const layer = document.getElementById("caption-layer");
      WORDS.forEach((w, i) => {
        const el = document.createElement("div");
        el.className = "cw" + (w.emph ? " emph" : "");
        el.id = "cw-" + i;
        const sp = document.createElement("span");
        sp.textContent = w.t;
        sp.style.fontSize = fontSizeFor(w.t) + "px";
        el.appendChild(sp);
        layer.appendChild(el);
      });

      // ===== Auto-fit real (después de que cargue la tipografía) =====
      // Mide el ancho verdadero de cada palabra y la achica hasta que entre en
      // MAX_W. Solo toca font-size: no altera la línea de tiempo ni el timing.
      function refitCaptions() {
        let shrunk = 0;
        WORDS.forEach((w, i) => {
          const sp = document.getElementById("cw-" + i).firstChild;
          let size = parseFloat(sp.style.fontSize);
          let guard = 0;
          while (sp.getBoundingClientRect().width > MAX_W && size > MIN && guard++ < 40) {
            size -= 1;
            sp.style.fontSize = size + "px";
            shrunk = 1;
          }
          if (sp.getBoundingClientRect().width > MAX_W) {
            console.warn("[caption-fit] la palabra \"" + w.t + "\" no entra ni en el tamaño mínimo (" +
              MIN + "px). Bajá --caption-min-size en brand.json o usá una tipografía más condensada.");
          }
        });
        if (shrunk) console.info("[caption-fit] auto-fit aplicado a las palabras más largas.");
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitCaptions);
      else window.addEventListener("load", refitCaptions);

      // ===== Timeline (HyperFrames exige paused + registro en __timelines) =====
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Hook: pop escalonado al entrar, salida limpia a los 3.2s
      tl.fromTo("#hook-l1",
        { opacity: 0, y: -46, scale: 0.86 },
        { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "back.out(1.8)" }, 0.12);
      tl.fromTo("#hook-l2",
        { opacity: 0, y: -34, scale: 0.82 },
        { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(2.1)" }, 0.30);
      tl.to("#hook", { opacity: 0, y: -50, duration: 0.26, ease: "power2.in" }, 2.94);
      tl.set("#hook", { visibility: "hidden" }, 3.2);

      // Captions: corte seco palabra por palabra (SIN karaoke, SIN animación)
      WORDS.forEach((w, i) => {
        const el = document.getElementById("cw-" + i);
        tl.set(el, { visibility: "visible", opacity: 1 }, w.show);
        tl.set(el, { visibility: "hidden", opacity: 0 }, w.hide);
      });

      window.__timelines["main"] = tl;

      // ===== Self-lint 1: nunca dos palabras visibles a la vez =====
      WORDS.forEach((w, i) => {
        const next = WORDS[i + 1];
        if (next && w.hide - next.show > 0.001) {
          console.warn("[caption-lint] overlap palabra " + i + " (" + w.t + ") hide=" +
            w.hide.toFixed(2) + " > show siguiente=" + next.show.toFixed(2));
        }
      });
      // ===== Self-lint 2: ninguna palabra visible después de su hide =====
      WORDS.forEach((w, i) => {
        const el = document.getElementById("cw-" + i);
        tl.seek(w.hide + 0.01);
        const c = window.getComputedStyle(el);
        if (c.visibility !== "hidden") {
          console.warn("[caption-lint] palabra " + i + " visible tras hide t=" + (w.hide + 0.01).toFixed(2));
        }
      });
      tl.seek(0);
    </script>
  </body>
</html>
